[project]
name = "dark-reposter"
version = "0.1.0"
description = "Telegram channel autoposter for X, Threads, Bluesky, LinkedIn and Mastodon via Buffer"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.13,<4",
  "aiohttp>=3.9,<4",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
dark-reposter = "dark_reposter.__main__:main"
